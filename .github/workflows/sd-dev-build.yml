# TEMPORARY (removed before merge): builds the System Designer for a session that cannot reach npm.
name: SD dev build
on:
  push:
    branches: ['sd/production-readiness']
  workflow_dispatch:
concurrency:
  group: sd-dev-build
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: tools/system_designer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add dependencies listed in .sd-add-deps
        run: |
          if [ -f .sd-add-deps ]; then npm install --save-exact --no-audit --no-fund $(cat .sd-add-deps); rm .sd-add-deps; fi
      - run: npm ci --no-audit --no-fund
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee /tmp/lint.txt
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee /tmp/typecheck.txt
      - name: Test
        id: test
        continue-on-error: true
        run: npx vitest run --reporter=dot 2>&1 | tee /tmp/test.txt
      - name: Build
        id: build
        run: npm run build 2>&1 | tee /tmp/build.txt
      - name: E2E and screenshots
        id: e2e
        continue-on-error: true
        run: |
          npx playwright install --with-deps chromium > /dev/null
          SD_SCREENS_DIR=/tmp/out/shots npx playwright test --reporter=line 2>&1 | tee /tmp/e2e.txt
      - name: Publish build to sd/production-readiness-build
        if: always()
        working-directory: .
        run: |
          mkdir -p /tmp/out/logs && cp /tmp/*.txt /tmp/out/logs/ 2>/dev/null || true
          cp -r illumenate_lighting/public/system_designer /tmp/out/bundle 2>/dev/null || true
          cp -r illumenate_lighting/illumenate_lighting/system_design/code_tables /tmp/out/code_tables 2>/dev/null || true
          cp tools/system_designer/package.json tools/system_designer/package-lock.json /tmp/out/
          echo "${{ github.sha }} lint=${{ steps.lint.outcome }} typecheck=${{ steps.typecheck.outcome }} test=${{ steps.test.outcome }} build=${{ steps.build.outcome }} e2e=${{ steps.e2e.outcome }}" > /tmp/out/STATUS
          cd /tmp/out && git init -q -b build && git add -A
          git -c user.name=sd-bot -c user.email=sd-bot@users.noreply.github.com commit -qm "build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build:sd/production-readiness-build
