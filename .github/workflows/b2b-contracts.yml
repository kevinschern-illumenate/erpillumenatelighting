name: B2B local contracts
on:
  pull_request:
  push:
    branches: [develop, main, staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local test dependencies
        run: |
          python -m pip install ruff PyYAML Jinja2 Pillow pypdf reportlab pypdfium2 jsonschema
          npm ci --prefix tests/portal_ui
          npm ci --prefix tests/portal_e2e
      - name: Python service and generator contracts
        run: |
          python -B -m unittest discover -s tests/portal_unit
          python -B -m unittest discover -s tools/fixture_builder/tests
      - name: Render templates and test browser DOM contracts
        run: |
          python -B tools/check_portal_templates.py
          node --test tests/portal_ui/*.test.cjs
          node tests/portal_unit/publication_workflow.test.cjs
          node --test tests/portal_unit/reconciliation.test.cjs
          npm run list --prefix tests/portal_e2e
      - name: Product Finder bundles are fresh
        run: |
          npm ci --prefix tools/configurator_ui
          npm test --prefix tools/configurator_ui
          npm run build:portal --prefix tools/configurator_ui
          npm run build:public --prefix tools/configurator_ui
          git diff --exit-code illumenate_lighting/public/product_finder
      - name: Catalog Builder bundle is fresh
        run: |
          npm ci --prefix tools/yaml_builder_ui
          npm test --prefix tools/yaml_builder_ui
          npm run test:render --prefix tools/yaml_builder_ui
          npm run build:erp --prefix tools/yaml_builder_ui
          git diff --exit-code illumenate_lighting/public/catalog_builder
      - name: System Designer bundle is fresh
        run: |
          npm ci --prefix tools/system_designer
          npm run lint --prefix tools/system_designer
          npm test --prefix tools/system_designer
          npm run typecheck --prefix tools/system_designer
          npm run build --prefix tools/system_designer
          npm run schema:export --prefix tools/system_designer
          git status --porcelain --untracked-files=all illumenate_lighting/public/system_designer illumenate_lighting/illumenate_lighting/system_design/code_tables | (! grep .)
          git diff --exit-code illumenate_lighting/public/system_designer illumenate_lighting/illumenate_lighting/system_design/code_tables
      - name: Catalog Builder browser workflow
        run: |
          npm ci --prefix tests/portal_e2e
          BROWSER_EXECUTABLE="$(command -v google-chrome)" npm run test:browser --prefix tools/yaml_builder_ui
      - name: PDF filler and merger contract
        run: python -B tools/check_pdf_fidelity.py
      - name: Generated spec sheet matches the InDesign golden
        env:
          ILL_SPEC_SHEET_CHROMIUM: google-chrome
        run: |
          python -m pip install pymupdf
          google-chrome --version
          python -B -m unittest discover -s tools/spec_sheets/tests -v
      - name: Changed-file lint and schemas
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          export B2B_BASE_REF="${PR_BASE:-HEAD^}"
          python -B tools/check_b2b_changes.py
      - name: Retain synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2b-local-contract-evidence
          retention-days: 14
          include-hidden-files: true
          path: |
            .tools/b2b-validation.json
            .tools/portal-pdf-qa/
            .tools/spec-sheet-fidelity/
