{#- Test print: a 0.3 mm border 1 mm in, and a 10 mm ruler, to check size, orientation and scale. -#}
<div style="position:absolute; left:1mm; top:1mm; right:1mm; bottom:1mm; border:0.3mm solid #000;"></div>
<div class="abs b" style="left:3mm; top:3mm; font-size:9pt;">TEST · {{ c.stock }}</div>
<div class="abs" style="left:3mm; top:8mm; font-size:6.5pt;">{{ width_mm }} x {{ height_mm }} mm · border 1 mm in</div>
<div class="rule" style="left:3mm; top:15mm; width:10mm;"></div>
{%- for tick in range(11) %}<div style="position:absolute; left:{{ 3 + tick }}mm; top:{{ 13.5 if tick % 5 else 12.5 }}mm; height:{{ 1.5 if tick % 5 else 2.5 }}mm; border-left:0.2mm solid #000;"></div>{% endfor %}
<div class="abs" style="left:14.5mm; top:13.2mm; font-size:6.5pt;">10 mm</div>
