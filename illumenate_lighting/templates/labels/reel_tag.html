{#- Reel ID tag (1.5 x 2.5): printed in a block before the count; stuck on, then scanned. -#}
{% from "templates/labels/_label.html" import top_strip with context %}
{{ top_strip(c, 18) }}
<div class="abs b" style="left:1.5mm; top:8.2mm; width:60.5mm; text-align:center; font-size:20pt; line-height:1;">{{ c.reel_id }}</div>
