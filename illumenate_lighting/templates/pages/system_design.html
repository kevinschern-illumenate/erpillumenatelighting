{% extends "templates/web.html" %}
{% block page_content %}
{% include "templates/includes/portal_navigation.html" %}
<link rel="stylesheet" href="{{ assets }}.css?v={{ asset_version }}">
{% if schedule_name %}
<nav class="ill-sd-breadcrumb" aria-label="Breadcrumb"><a href="/portal/schedules/{{ schedule_name | urlencode }}">{{ _("Back to schedule") }}</a></nav>
{% endif %}
<div id="ill-system-designer-root"></div>
{% endblock %}
{% block script %}
<script type="module">
import {{ (assets ~ ".js?v=" ~ asset_version) | tojson }};
window.IllSystemDesigner.mount(document.getElementById("ill-system-designer-root"), {{ mount_options | tojson }});
</script>
{% endblock %}
