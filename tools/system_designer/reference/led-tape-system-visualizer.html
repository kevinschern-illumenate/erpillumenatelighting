function applyXray() {
  archMats.forEach((m) => {
    const o = m.userData.xray ? clamp(state.xray * m.userData.scale, 0, 1) : 1;
    const transparent = o < 0.995;
    if (m.transparent !== transparent) m.needsUpdate = true;
    m.transparent = transparent; m.opacity = o; m.depthWrite = !transparent;
  });
  archEdgeMat.opacity = clamp(0.4 + state.xray * 0.45, 0, 0.9);
  archEdgeMat.visible = state.edges;
  requestRender();
}
function applyBackground(forceTransparent = false) {
  const bg = BACKGROUNDS[state.bg], transparent = forceTransparent || bg.color === null;
  if (transparent) renderer.setClearColor(0x000000, 0); else renderer.setClearColor(bg.color, 1);
  const stage = $('#stage');
  stage.classList.toggle('checker', bg.color === null);
  stage.style.backgroundColor = bg.color || '';
}
function applyShadows() {
  renderer.shadowMap.enabled = state.shadows;
  keyLight.castShadow = state.shadows;
  scene.traverse((o) => { if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => (m.needsUpdate = true)); });
  requestRender();
}
function setHideUI(on) {

  document.body.classList.toggle('capture', on);
  const hint = $('#captureHint');
  if (on) { hint.classList.add('show'); clearTimeout(setHideUI._t); setHideUI._t = setTimeout(() => hint.classList.remove('show'), 2600); }
  else hint.classList.remove('show');
  applyVisibility(); syncUI();
}
function togglePanel() {
  const c = $('#app').classList.toggle('collapsed');

}
function toast(msg) {

/* =====================================================================
   17. EXPORT — PNG at 1×/2×/4× of the current view, labels composited,
   optional transparent background. File name = brand_view_timestamp.
   ===================================================================== */
function maxCanvasDim() {
  const gl = renderer.getContext();
  const rb = gl.getParameter(gl.MAX_RENDERBUFFER_SIZE), vp = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
  return Math.min(rb, vp[0], vp[1], 16384);
}
function effectiveExportScale() {
  const lim = maxCanvasDim();
  return Math.min(state.exportScale, lim / Math.max(viewW, viewH, 1));
}
function renderTo(cam) {
  if (state.mode === 'schem') renderer.render(schemScene, schemCam);
  else if (state.mode === 'train') {
    const v = currentVisual();
    if (v.kind === '3d') { ensureTrain3D(v); renderer.render(trainScene, perspCam); } else renderer.render(emptyScene, perspCam);
  } else renderer.render(scene, cam);
}

async function renderPNGBlob() {
  const s = effectiveExportScale(), prevPR = renderer.getPixelRatio();
  const transparent = state.exportTransparent || BACKGROUNDS[state.bg].color === null;
  try {
    renderer.setPixelRatio(s);                          // resizes the drawing buffer only (CSS size unchanged)
    applyBackground(transparent);
    renderTo(rig.camera);
    const out = makeCanvas(glCanvas.width, glCanvas.height), ctx = out.getContext('2d');
    ctx.drawImage(glCanvas, 0, 0);
    ctx.setTransform(out.width / viewW, 0, 0, out.height / viewH, 0, 0);
    drawOverlay(ctx, viewW, viewH, rig.camera);
    return { blob: await new Promise((res) => out.toBlob(res, 'image/png')), s, w: out.width, h: out.height };
  } finally {
    renderer.setPixelRatio(prevPR);
    applyBackground(false);
    renderFrame();
  }
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
async function exportPNG(viewName, { quiet = false } = {}) {
  const { blob, s, w, h } = await renderPNGBlob();
  if (!blob) { toast('Export failed — try a smaller scale'); return; }
  const sx = Number.isInteger(s) ? s : s.toFixed(1);
  const name = `${slug(BRAND.name)}_${slug(viewName || 'view')}_${timestamp()}_${sx}x.png`;
  downloadBlob(blob, name);
  if (!quiet) toast(`Exported ${w} × ${h} px — ${name}`);
  return name;
}
async function exportAllSaved() {
  const filled = state.slots.map((s, i) => ({ s, i })).filter((o) => o.s);
  if (!filled.length) { toast('No saved views yet — use Save in the View section'); return; }
  const keep = getView(), keepName = state.viewName;
  for (const { s, i } of filled) {
    setView(s.view); state.viewName = s.name; updateBadge();
    await exportPNG(s.name || `view-${i + 1}`, { quiet: true });
    await new Promise((r) => setTimeout(r, 450));       // give the browser time between downloads
  }
  setView(keep); state.viewName = keepName; updateBadge();
  toast(`Exported ${filled.length} saved view${filled.length > 1 ? 's' : ''}`);
}

/* =====================================================================
   18. LAYOUT, RESIZE & RENDER LOOP
   ===================================================================== */
let viewW = 1, viewH = 1, needsRender = true;
function requestRender() { needsRender = true; }
function layout() {
  const vp = $('#viewport'), W = Math.max(1, vp.clientWidth), H = Math.max(1, vp.clientHeight);
  let w = W, h = H;
  if (state.aspect !== 'fill') {
    const [a, b] = state.aspect.split(':').map(Number), r = a / b;
    if (W / H > r) { h = H; w = Math.round(H * r); } else { w = W; h = Math.round(W / r); }
  }
  const stage = $('#stage');
  Object.assign(stage.style, { width: w + 'px', height: h + 'px', left: Math.round((W - w) / 2) + 'px', top: Math.round((H - h) / 2) + 'px' });
  const wasW = viewW;
  viewW = w; viewH = h;
  renderer.setSize(w, h, true);
  const dpr = renderer.getPixelRatio();
  overlayCanvas.width = Math.round(w * dpr); overlayCanvas.height = Math.round(h * dpr);

  card(ctx, 60, 140, 1000, 430);
  const x0 = 300, x1 = 1000, yC = 200, yL = 300;
  line(ctx, [[90, yC], [1030, yC]], { color: P.faint, width: 3 });
  txt(ctx, 'Ceiling', 1030, yC - 10, { size: 14, color: P.muted, align: 'right' });
  if (lightLevel() > 0) {
    const g = ctx.createLinearGradient(0, yL, 0, yC); g.addColorStop(0, hexA(CCT_COLORS[state.cct], 0.5 * Math.min(1, lightLevel()))); g.addColorStop(1, hexA(CCT_COLORS[state.cct], 0.08));
    ctx.fillStyle = g; ctx.fillRect(x0, yC + 2, x1 - x0, yL - yC - 8);
  }
  drawStrip(ctx, x0, yL - 10, x1 - x0, 8);
  roundRect(ctx, x0 - 10, yL, x1 - x0 + 20, 16, 3); ctx.fillStyle = P.channel; ctx.fill();
  txt(ctx, 'Cove ledge', x0 - 18, yL + 12, { size: 14, color: P.muted, align: 'right' });
  dimH(ctx, x0, x1, yL + 60, `${fmt(E.runFt)} ft cove run`, { size: 17 });
  drawPSU(ctx, 100, 440, 150, 76, `${E.volts}V supply`, 'in closet');
  drawWire2D(ctx, [[175, 440], [175, yL - 6], [x0 - 2, yL - 6]], ZONE_COLORS[0], { width: 5 });
  pill(ctx, `${fmt(E.supplyDistFt)} ft from run start`, 190, 380, { bg: P.card, stroke: ZONE_COLORS[0], size: 15 });
  txt(ctx, 'Living room', 650, 520, { size: 20, color: P.faint, align: 'center', weight: 600 });
  [['Run', `${fmt(E.runFt)} ft cove`], ['Tape', `${E.volts}V · ${fmt(E.wPerFt, 2)} W/ft`], ['Supply location', `${fmt(E.supplyDistFt)} ft from the start of the run`], ['Max run, single-end feed', `${fmt(E.maxRunFt)} ft [spec]`]].forEach(([k, v], i) => {
    card(ctx, 1090, 140 + i * 110, 450, 96);
    txt(ctx, k, 1114, 176 + i * 110, { size: 15, color: P.muted, weight: 600 });
    txt(ctx, v, 1114, 212 + i * 110, { size: 25, weight: 700, maxW: 410 });
  });
  if (step < 2) return;
  const steps = [
    ['Load & supply size', `${fmt(S.load)} W load → ${S.sup ? S.sup + ' W supply' : 'over the largest size'}`, null],
    ['Max run length', `${fmt(E.runFt)} ft vs ${fmt(E.maxRunFt)} ft max`, E.runFt <= E.maxRunFt],
    ['Feed method', methodById(S.method).name, null],
    ['Wire gauge', `${E.wireAwg} AWG · ${fmt(S.wire.pct)}% drop`, S.wire.pct <= E.dropLimitPct],
  ];
  steps.forEach(([title, result, ok], i) => {
    const x = 60 + i * 375, y = 610;
    card(ctx, x, y, 355, 200);
    badge(ctx, i + 1, x + 40, y + 44, 20);
    txt(ctx, `Calculation ${i + 1}`, x + 72, y + 38, { size: 14, color: P.muted, weight: 600 });
    txt(ctx, title, x + 72, y + 62, { size: 22, weight: 700 });
    if (step >= 3) {
      line(ctx, [[x + 24, y + 96], [x + 331, y + 96]], { color: P.line, width: 1.5 });
      wrap(ctx, result, x + 24, y + 136, 300, { size: 22, weight: 700, color: P.brandInk });
      if (ok !== null) txt(ctx, ok ? 'Within the limit' : 'Over the limit', x + 24, y + 180, { size: 15, weight: 700, color: ok ? P.good : P.bad });
    }
    if (i < 3) arrowHead(ctx, x + 368, y + 100, 0, 12, P.faint);
  });
}

function drawLoad(ctx, step) {
  const E = EXAMPLE, S = exampleSummary();
  card(ctx, 60, 140, 1480, 74, { fill: hexA(BRAND.primary, currentTheme() === 'dark' ? 0.35 : 0.08), stroke: hexA(BRAND.primary, 0.35), shadow: false });
  txt(ctx, `Supply size  =  ( Length × W/ft )  ÷  ${E.derate}   → round up to the next standard size`, 800, 186, { size: 27, weight: 600, align: 'center', color: P.brandInk });
  const tiles = [
    { k: 'Length', v: `${fmt(E.runFt)} ft`, at: 2 }, '×',
    { k: 'Watts per foot', v: `${fmt(E.wPerFt, 2)} W/ft`, at: 2 }, '=',
    { k: 'Total load', v: `${fmt(S.load)} W`, at: 2, emph: true }, '÷',
    { k: `${Math.round(E.derate * 100)}% rule`, v: `${E.derate}`, at: 3 }, '=',
    { k: 'Minimum supply', v: `${fmt(S.min)} W`, at: 3, emph: true }, '→',
    { k: 'Next size up', v: S.sup ? `${S.sup} W` : 'n/a', at: 4, final: true },
  ];
  let x = 80; const y = 250, tw = 205, ow = 46, th = 140;
  tiles.forEach((t) => {
    if (typeof t === 'string') { txt(ctx, t, x + ow / 2, y + th / 2 + 2, { size: 38, weight: 300, color: P.muted, align: 'center', baseline: 'middle' }); x += ow; return; }
    const shown = step >= t.at, fin = t.final && shown;
    card(ctx, x, y, tw, th, { fill: fin ? P.brand : P.card, stroke: t.emph && shown ? P.brand : P.cardLine, lw: t.emph && shown ? 2.5 : 1.5 });
    txt(ctx, t.k, x + tw / 2, y + 40, { size: 16, weight: 600, color: fin ? DS.secondary[100] : P.muted, align: 'center' });
    txt(ctx, shown ? t.v : '?', x + tw / 2, y + 98, { size: 36, weight: 700, color: fin ? '#fff' : shown ? P.ink : P.faint, align: 'center', maxW: tw - 16 });
    x += tw;
  });
  if (step >= 3) {
    card(ctx, 60, 440, 1000, 400);
    txt(ctx, 'Standard supply sizes', 90, 482, { size: 18, weight: 700 });
    let px = 90;
    EXAMPLE.supplySizes.slice().sort((a, b) => a - b).forEach((s) => {
      const chosen = step >= 4 && s === S.sup, under = s < S.min;
      px += pill(ctx, `${s} W`, px, 524, { bg: chosen ? P.brand : under ? 'rgba(0,0,0,0)' : P.soft, color: chosen ? '#fff' : under ? P.faint : P.ink, stroke: under ? P.line : null, size: 17 }) + 10;
    });
    txt(ctx, `Sizes under ${fmt(S.min)} W are too small. Round up, never down.`, 90, 572, { size: 16, color: P.muted });
    card(ctx, 1090, 440, 450, 400, { fill: hexA(BRAND.accent, 0.1), stroke: hexA(BRAND.accent, 0.5), shadow: false });
    txt(ctx, 'AV analogy', 1120, 486, { size: 15, weight: 700, color: P.muted });
    wrap(ctx, 'Same as leaving amplifier headroom.', 1120, 528, 390, { size: 26, weight: 700 });
    wrap(ctx, 'A supply run at 100% runs hot and fails early. Never run a supply at its limit.', 1120, 610, 390, { size: 19, color: P.muted });
  }
  if (step >= 4 && S.sup) {
    const bx0 = 90, bx1 = 1030, by = 650, bh = 50, k = (bx1 - bx0) / S.sup, cap = S.sup * E.derate;
    txt(ctx, `${S.sup} W supply, loaded with ${fmt(S.load)} W`, bx0, 628, { size: 18, weight: 700 });
    roundRect(ctx, bx0, by, bx1 - bx0, bh, 8); ctx.fillStyle = P.soft; ctx.fill();
    hatch(ctx, bx0 + cap * k, by, (S.sup - cap) * k, bh, P.bad);
    roundRect(ctx, bx0, by, Math.max(8, S.load * k), bh, 8); ctx.fillStyle = P.brand; ctx.fill();
    txt(ctx, `${fmt(S.load)} W · ${Math.round(S.load / S.sup * 100)}% loaded`, bx0 + 16, by + bh / 2 + 1, { size: 18, weight: 700, color: '#fff', baseline: 'middle' });
    line(ctx, [[bx0 + cap * k, by - 14], [bx0 + cap * k, by + bh + 14]], { color: P.bad, width: 2.5, dash: [7, 6] });
    txt(ctx, `${Math.round(E.derate * 100)}% limit · ${fmt(cap)} W`, bx0 + cap * k, by + bh + 38, { size: 16, weight: 700, color: P.bad, align: 'center' });
    if (cap > S.load) txt(ctx, `${fmt(cap - S.load)} W headroom`, bx0 + (S.load + (cap - S.load) / 2) * k, by - 14, { size: 15, weight: 600, color: P.good, align: 'center' });
    [0, 0.25, 0.5, 0.75, 1].forEach((f) => txt(ctx, `${fmt(S.sup * f, 0)}`, bx0 + f * (bx1 - bx0), by + bh + 72, { size: 13, color: P.faint, align: 'center' }));
  }
}

function drawMaxRun(ctx, step) {
  const E = EXAMPLE, L = E.runFt, single = CALC.feedPoints('single', L), both = CALC.feedPoints('both', L);
  const X0 = 150, X1 = 960, Y0 = 190, Y1 = 500, xp = (x) => X0 + (x / L) * (X1 - X0), yp = (b) => Y1 - (b - 0.5) / 0.5 * (Y1 - Y0);
  card(ctx, 60, 140, 960, 440);
  for (let b = 0.5; b <= 1.0001; b += 0.1) { line(ctx, [[X0, yp(b)], [X1, yp(b)]], { color: P.line, width: 1 }); txt(ctx, `${Math.round(b * 100)}%`, X0 - 14, yp(b) + 5, { size: 14, color: P.muted, align: 'right' }); }
  const tick = L <= 24 ? 2 : L <= 60 ? 5 : 10;
  for (let x = 0; x <= L + 1e-6; x += tick) txt(ctx, `${x}`, xp(x), Y1 + 26, { size: 14, color: P.muted, align: 'center' });
  txt(ctx, 'Distance along the run (ft)', (X0 + X1) / 2, Y1 + 56, { size: 15, color: P.muted, align: 'center', weight: 600 });
  txt(ctx, 'Relative brightness', X0, Y0 - 22, { size: 15, color: P.muted, weight: 600 });
  if (step >= 2 && L > E.maxRunFt) { ctx.fillStyle = hexA(P.bad, 0.08); ctx.fillRect(xp(E.maxRunFt), Y0, X1 - xp(E.maxRunFt), Y1 - Y0); }
  const curve = (feeds, color) => {
    ctx.beginPath();
    for (let i = 0; i <= 160; i++) { const x = L * i / 160, X = xp(x), Y = yp(CALC.brightnessAt(x, feeds, L)); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }
    ctx.strokeStyle = color; ctx.lineWidth = 4.5; ctx.stroke();
  };
  curve(single, P.warn);
  if (step >= 3) curve(both, P.good);
  if (step >= 2 && E.maxRunFt < L) {
    line(ctx, [[xp(E.maxRunFt), Y0 - 6], [xp(E.maxRunFt), Y1]], { color: P.bad, width: 2.5, dash: [8, 7] });
    pill(ctx, `Max run · ${fmt(E.maxRunFt)} ft`, xp(E.maxRunFt), Y0 + 2, { bg: P.bad, color: '#fff', size: 15, align: 'center' });
  }
  pill(ctx, 'Single-end feed', X0 + 14, Y1 - 28, { bg: hexA(P.warn, 0.15), color: P.warn, size: 15 });
  if (step >= 3) pill(ctx, 'Both-end feed', X0 + 170, Y1 - 28, { bg: hexA(P.good, 0.15), color: P.good, size: 15 });
  // strips under the chart, aligned to the x axis
  const sMin = CALC.minBrightness(single, L), bMin = CALC.minBrightness(both, L);
  const row = (y, feeds, label, minB, extraWire) => {
    txt(ctx, label, X0, y - 20, { size: 16, weight: 700 });
    drawPSU(ctx, 62, y - 22, 70, 44, 'PSU');
    drawWire2D(ctx, [[132, y], [X0 - 6, y]], ZONE_COLORS[0], { width: 4 });
    if (extraWire) drawWire2D(ctx, [[97, y + 22], [97, y + 40], [X1 + 16, y + 40], [X1 + 16, y], [X1 + 6, y]], ZONE_COLORS[0], { width: 4 });
    drawStrip(ctx, X0, y - 8, X1 - X0, 16, (u) => CALC.brightnessAt(u * L, feeds, L));
    flowDots(ctx, X0, y, X1 - X0, feeds.map((f) => f / L));
    pill(ctx, `${extraWire ? 'Dimmest ' : 'Far end '}${Math.round(minB.b * 100)}%`, X1, y - 26, { bg: goodBad(minB.b), color: '#fff', size: 14, align: 'right' });
  };
  row(640, single, 'Single-end feed', sMin, false);
  if (step >= 3) { row(760, both, 'Both-end feed (same supply)', bMin, true); txt(ctx, 'Extra wire to the far end', (X0 + X1) / 2, 822, { size: 14, color: P.muted, align: 'center' }); }
  // explanation cards
  card(ctx, 1050, 140, 490, 170);
  txt(ctx, 'Why it fades', 1076, 180, { size: 15, weight: 700, color: P.muted });
  wrap(ctx, 'Voltage drops along the tape’s own copper. Far from the feed, the tape is dimmer and may shift color.', 1076, 216, 440, { size: 20 });
  if (step >= 2) {
    const over = L > E.maxRunFt;
    card(ctx, 1050, 330, 490, 190, { fill: hexA(over ? P.bad : P.good, 0.08), stroke: hexA(over ? P.bad : P.good, 0.5), shadow: false });
    drawCheck(ctx, 1090, 378, 20, !over);
    txt(ctx, over ? `${fmt(L)} ft run > ${fmt(E.maxRunFt)} ft max` : `${fmt(L)} ft run ≤ ${fmt(E.maxRunFt)} ft max`, 1124, 386, { size: 24, weight: 700, maxW: 400 });
    wrap(ctx, over ? 'A single-end feed doesn’t work. Feed from more than one point, or split the run.' : 'A single-end feed works for this run.', 1076, 436, 440, { size: 19, color: P.muted });
    txt(ctx, `[Spec max run: ${fmt(E.maxRunFt)} ft]`, 1076, 500, { size: 14, color: P.faint });
  }
  if (step >= 3) {
    card(ctx, 1050, 540, 490, 150, { fill: hexA(P.good, 0.08), stroke: hexA(P.good, 0.5), shadow: false });
    drawCheck(ctx, 1090, 588, 20, true);
    txt(ctx, `Both-end feed: dimmest ${Math.round(bMin.b * 100)}%`, 1124, 596, { size: 23, weight: 700, maxW: 400 });
    wrap(ctx, `Single-end feed bottoms out at ${Math.round(sMin.b * 100)}% at the far end.`, 1076, 644, 440, { size: 18, color: P.muted });
  }
}

function drawMethods(ctx, step) {
  const E = EXAMPLE, L = E.runFt, rec = CALC.recommendFeed(L, E.maxRunFt);
  const pos = [[60, 140], [820, 140], [60, 480], [820, 480]], w = 720, h = 320;
  FEED_METHODS.forEach((m, i) => {
    const [cx, cy] = pos[i];
    if (step < i + 1) { ghost(ctx, cx, cy, w, h); txt(ctx, m.name, cx + 28, cy + 50, { size: 24, weight: 700, color: P.faint }); return; }
    const feeds = CALC.feedPoints(m.id, L), mb = CALC.minBrightness(feeds, L);
    card(ctx, cx, cy, w, h);
    txt(ctx, m.name, cx + 28, cy + 50, { size: 26, weight: 700 });
    txt(ctx, `How: ${m.how}`, cx + 28, cy + 86, { size: 17, color: P.muted, maxW: w - 56 });
    txt(ctx, `Use when: ${m.when}`, cx + 28, cy + 112, { size: 17, maxW: w - 56 });
    if (step >= 4 && (m.id === rec || (rec === 'both' && m.id === 'center'))) pill(ctx, m.id === rec ? `Our ${fmt(L)} ft example` : 'Also works', cx + w - 26, cy + 44, { bg: P.good, color: '#fff', size: 14, align: 'right', icon: 'check' });
    const sx = cx + 160, sw = w - 220, sy = cy + 186;
    const fx = (p) => sx + (p / L) * sw;
    drawPSU(ctx, cx + 28, cy + 224, 96, 54, 'PSU');
    const busY = cy + 251;
    feeds.forEach((p, k) => {
      const X = fx(p), lane = busY + k * 0;
      drawWire2D(ctx, [[cx + 124, lane], [X, lane], [X, sy + 16]], ZONE_COLORS[0], { width: 4 });
    });
    drawStrip(ctx, sx, sy, sw, 14, (u) => CALC.brightnessAt(u * L, feeds, L));
    flowDots(ctx, sx, sy + 7, sw, feeds.map((p) => p / L));
    feeds.forEach((p) => { ctx.beginPath(); ctx.arc(fx(p), sy + 18, 6, 0, Math.PI * 2); ctx.fillStyle = ZONE_COLORS[0]; ctx.fill(); });
    txt(ctx, m.note, sx, cy + 300, { size: 14, color: P.muted, maxW: sw - 150 });
    pill(ctx, `Dimmest ${Math.round(mb.b * 100)}%`, cx + w - 26, cy + 294, { bg: goodBad(mb.b), color: '#fff', size: 14, align: 'right' });
  });
  if (step >= 4) {
    card(ctx, 60, 812, 1480, 46, { fill: hexA(P.bad, 0.08), stroke: hexA(P.bad, 0.45), shadow: false, r: 10 });
    txt(ctx, '⚠  Never power two ends from two separate supplies (unless the manufacturer allows it), and never connect the outputs of different supplies together.', 800, 841, { size: 16, weight: 600, align: 'center', color: P.ink, maxW: 1440 });
  }
}

function drawWireDrop(ctx, step) {
  const E = EXAMPLE, S = exampleSummary(), W = S.wire, ohm = AWG_OHMS_PER_1000FT[E.wireAwg];
  const chips = [
    ['Current', `${fmt(S.load)} W ÷ ${E.volts} V = ${fmt(S.I, 2)} A`],
    ['Round trip', `2 × ${fmt(E.supplyDistFt)} ft = ${fmt(W.roundTrip)} ft`],
    ['Resistance', `${fmt(W.roundTrip)} ÷ 1,000 × ${fmt(ohm, 2)} Ω = ${fmt(W.ohms, 2)} Ω`],
    ['Voltage drop', `${fmt(S.I, 2)} A × ${fmt(W.ohms, 2)} Ω = ${fmt(W.v, 2)} V`],
  ];
  chips.forEach(([k, v], i) => {
    const x = 60 + i * 375, shown = step >= i + 2;
    if (!shown) { ghost(ctx, x, 140, 355, 96); txt(ctx, k, x + 22, 176, { size: 15, weight: 600, color: P.faint }); return; }
    card(ctx, x, 140, 355, 96, { stroke: step === i + 2 ? P.brand : P.cardLine, lw: step === i + 2 ? 2.5 : 1.5 });
    txt(ctx, `${i + 1}. ${k}`, x + 22, 176, { size: 15, weight: 600, color: P.muted });
    txt(ctx, v, x + 22, 214, { size: 21, weight: 700, maxW: 320 });
  });
  card(ctx, 60, 266, 1480, 290);
  drawPSU(ctx, 100, 336, 170, 120, `${E.volts}V supply`, step >= 2 ? `${fmt(S.I, 2)} A out` : null);
  const tx0 = 1180, tx1 = 1490;
  drawStrip(ctx, tx0, 384, tx1 - tx0, 18);
  txt(ctx, `${fmt(S.load)} W of tape`, (tx0 + tx1) / 2, 440, { size: 16, color: P.muted, align: 'center', weight: 600 });
  drawWire2D(ctx, [[270, 360], [1120, 360], [1172, 388]], P.bad, { width: 6 });
  drawWire2D(ctx, [[1172, 398], [1120, 430], [270, 430]], P.wire, { width: 6 });
  arrowHead(ctx, 700, 360, 0, 16, P.bad); arrowHead(ctx, 690, 430, Math.PI, 16, P.wire);
  txt(ctx, `+  ${fmt(E.supplyDistFt)} ft out`, 700, 340, { size: 17, weight: 700, align: 'center' });
  txt(ctx, `−  ${fmt(E.supplyDistFt)} ft back`, 700, 466, { size: 17, weight: 700, align: 'center' });
  if (step >= 3) pill(ctx, `Round trip: ${fmt(W.roundTrip)} ft`, 940, 395, { bg: P.brand, color: '#fff', size: 16, align: 'center' });
  if (step >= 4) pill(ctx, `${E.wireAwg} AWG · ≈${fmt(ohm, 2)} Ω per 1,000 ft`, 300, 510, { bg: P.soft, size: 15 });
  if (step >= 5) {
    card(ctx, 60, 586, 1000, 250);
    txt(ctx, 'Voltage at the supply vs. at the tape', 90, 628, { size: 18, weight: 700 });
    const lo = E.volts * (1 - Math.max(E.dropLimitPct * 1.5, W.pct * 1.4) / 100), hi = E.volts, bx0 = 110, bx1 = 1010, k = (bx1 - bx0) / (hi - lo);
    const X = (vv) => bx0 + (vv - lo) * k, by = 700;
    roundRect(ctx, bx0, by, bx1 - bx0, 24, 6); ctx.fillStyle = P.soft; ctx.fill();
    const vt = E.volts - W.v;
    roundRect(ctx, X(vt), by, X(hi) - X(vt), 24, 6); ctx.fillStyle = hexA(W.pct <= E.dropLimitPct ? P.good : P.bad, 0.55); ctx.fill();
    const lim = E.volts * (1 - E.dropLimitPct / 100);
    line(ctx, [[X(lim), by - 16], [X(lim), by + 40]], { color: P.bad, width: 2.5, dash: [7, 6] });
    txt(ctx, `${E.dropLimitPct}% limit · ${fmt(lim, 2)} V`, X(lim), by + 62, { size: 15, weight: 700, color: P.bad, align: 'center' });
    pill(ctx, `At supply ${fmt(hi, 2)} V`, X(hi), by - 30, { bg: P.card, stroke: P.line, size: 14, align: 'right' });
    pill(ctx, `At tape ${fmt(vt, 2)} V`, X(vt), by + 62, { bg: P.card, stroke: P.line, size: 14, align: X(vt) - X(lim) < 140 ? 'left' : 'center' });
    txt(ctx, `${fmt(W.v, 2)} V drop = ${fmt(W.pct)}% of ${E.volts} V`, bx0, 812, { size: 18, weight: 700, color: P.brandInk });
  }
  if (step >= 6) {
    const ok = W.pct <= E.dropLimitPct;
    card(ctx, 1090, 586, 450, 250, { fill: hexA(ok ? P.good : P.bad, 0.08), stroke: hexA(ok ? P.good : P.bad, 0.5), shadow: false });
    drawCheck(ctx, 1130, 634, 22, ok);
    txt(ctx, ok ? `Within the ${E.dropLimitPct}% guideline` : `Over the ${E.dropLimitPct}% guideline`, 1166, 642, { size: 22, weight: 700, maxW: 360 });
    wrap(ctx, ok ? 'Keep the supply close to the tape, and use heavier wire as the distance grows.' : 'Move up a gauge, or move the supply closer to the tape.', 1116, 690, 400, { size: 19, color: P.muted });
  }
}

function drawGaugeTable(ctx, step) {
  const E = EXAMPLE, rows = [1, 2, 3, 4, 5, 6, 8], cols = [5, 10, 15, 20, 25, 30, 40, 50];
  const S = exampleSummary(), exRow = rows.find((r) => r >= S.I - 1e-9) ?? rows[rows.length - 1], exCol = cols.find((c) => c >= E.supplyDistFt - 1e-9) ?? cols[cols.length - 1];
  const tx = 60, ty = 150, lw = 250, cw = (1480 - lw) / cols.length, rh = 74;
  const shade = { 18: 0.12, 16: 0.28, 14: 0.45, 12: 0.65, 10: 0.85 };
  card(ctx, tx, ty, 1480, 60 + rh * rows.length + 10);
  txt(ctx, 'Current  (≈ load at ' + E.volts + ' V)', tx + 24, ty + 38, { size: 15, weight: 700, color: P.muted });
  cols.forEach((c, j) => txt(ctx, `${c} ft`, tx + lw + j * cw + cw / 2, ty + 38, { size: 17, weight: 700, align: 'center', color: c === exCol && step >= 2 ? P.brandInk : P.ink }));
  txt(ctx, 'One-way distance, supply to tape →', tx + lw + 4, ty - 10, { size: 14, color: P.muted, weight: 600 });
  rows.forEach((r, i) => {
    const y = ty + 60 + i * rh;
    txt(ctx, `${r} A`, tx + 24, y + rh / 2 - 4, { size: 22, weight: 700, color: r === exRow && step >= 2 ? P.brandInk : P.ink });
    txt(ctx, `≈ ${r * E.volts} W`, tx + 110, y + rh / 2 - 4, { size: 15, color: P.muted });
    cols.forEach((c, j) => {
      const g = CALC.gaugeFor(r, c), x = tx + lw + j * cw;
      roundRect(ctx, x + 4, y + 4, cw - 8, rh - 8, 8);
      ctx.fillStyle = g ? hexA(BRAND.primary, shade[g]) : hexA(P.bad, 0.12); ctx.fill();

function drawCut(ctx, step) {
  const C = cutMath(), bx0 = 100, bx1 = 1500, pxIn = (bx1 - bx0) / C.runIn, tapeX = bx0 + C.tapeIn * pxIn;
  dimH(ctx, bx0, bx1, 168, `${fmtLen(C.runIn * IN)} = ${fmt(C.runIn, 2)} in run`, { size: 17 });
  roundRect(ctx, bx0, 200, bx1 - bx0, 44, 6); ctx.fillStyle = P.channel; ctx.fill();
  roundRect(ctx, bx0 + 4, 211, Math.max(0, tapeX - bx0 - 4), 22, 3); ctx.fillStyle = litColor(1).getStyle(); ctx.fill();
  if (step >= 2) {
    const every = C.iv * pxIn < 6 ? Math.ceil(6 / (C.iv * pxIn)) : 1;
    for (let k = 1; k <= C.seg; k += every) { const x = bx0 + k * C.iv * pxIn; line(ctx, [[x, 208], [x, 236]], { color: hexA('#000000', 0.35), width: 1.2 }); }
    dimH(ctx, bx0, tapeX, 290, `${C.seg} segments × ${fmt(C.iv, 2)} in = ${fmt(C.tapeIn, 2)} in of tape`, { size: 17 });
  }
  if (C.dark > 0) hatch(ctx, tapeX, 206, bx1 - tapeX, 32, P.warn);
  ctx.fillStyle = '#5a616c'; ctx.fillRect(bx1, 196, 8, 52);
  txt(ctx, 'Profile (cut to length)', bx0, 266, { size: 14, color: P.muted });
  if (step < 3) return;
  const winIn = Math.min(C.runIn, C.iv * 4 + Math.max(C.dark, C.iv * 0.5) + 1), w0 = C.runIn - winIn;
  const hx0 = bx0 + w0 * pxIn;
  roundRect(ctx, hx0 - 4, 192, bx1 - hx0 + 16, 60, 6); ctx.lineWidth = 2.5; ctx.strokeStyle = P.brand; ctx.stroke();
  const ix0 = 160, ix1 = 1400, pI = (ix1 - ix0) / winIn, X = (inch) => ix0 + (inch - w0) * pI;
  line(ctx, [[(hx0 + bx1) / 2, 252], [(hx0 + bx1) / 2, 340]], { color: P.brand, width: 2, dash: [6, 6] });
  card(ctx, 100, 340, 1400, 300, { stroke: P.brand, lw: 2 });
  ctx.fillStyle = P.soft; ctx.fillRect(ix0, 414, ix1 - ix0, 152);
  ctx.fillStyle = P.channel; ctx.fillRect(ix0, 400, ix1 - ix0, 14); ctx.fillRect(ix0, 566, ix1 - ix0, 14);
  const tEnd = X(C.tapeIn);
  ctx.fillStyle = P.pcb; ctx.fillRect(ix0, 446, tEnd - ix0, 88);
  line(ctx, [[ix0, 446], [tEnd, 446]], { color: P.faint, width: 1 }); line(ctx, [[ix0, 534], [tEnd, 534]], { color: P.faint, width: 1 });
  const firstSeg = Math.floor(w0 / C.iv + 1e-9);
  for (let s = firstSeg; s < C.seg; s++) {
    for (let k = 0; k < EXAMPLE.ledsPerSegment; k++) {
      const inch = s * C.iv + C.iv * (k + 0.5) / EXAMPLE.ledsPerSegment, x = X(inch);
      if (x < ix0 + 10) continue;
      ctx.fillStyle = lightLevel() > 0 ? litColor(1).getStyle() : COLORS.chip;
      roundRect(ctx, x - 13, 477, 26, 26, 3); ctx.fill();
      ctx.strokeStyle = hexA('#000000', 0.25); ctx.lineWidth = 1; ctx.stroke();
    }
  }
  const cuts = []; for (let s = Math.ceil(w0 / C.iv - 1e-9); s <= C.seg; s++) { const inch = s * C.iv; if (inch > w0 + 0.05) cuts.push(inch); }
  cuts.forEach((inch) => {
    const x = X(inch);
    ctx.fillStyle = '#c98a3e';
    [[x - 15, 454], [x + 3, 454], [x - 15, 512], [x + 3, 512]].forEach(([px, py]) => { if (px + 12 <= tEnd + 0.5) ctx.fillRect(px, py, 12, 16); });
    line(ctx, [[x, 432], [x, 548]], { color: P.ink, width: 2, dash: [6, 5] });
  });
  if (cuts.length >= 2) {
    const a = X(cuts[cuts.length - 3] ?? cuts[0]), b = X(cuts[cuts.length - 2] ?? cuts[1]);
    dimH(ctx, a, b, 380, `${fmt(C.iv, 2)} in cut interval`, { size: 16 });
    drawIcon(ctx, 'scissors', a, 420, 26, P.ink);
    pill(ctx, 'Cut only on the marked line (copper pads)', a - 20, 610, { bg: P.soft, size: 15, align: 'right' });
  }
  if (C.dark > 0) {
    hatch(ctx, tEnd, 414, ix1 - tEnd, 152, P.warn);
    dimH(ctx, tEnd, ix1, 604, `${fmt(C.dark, 2)} in dark end`, { color: P.warn, size: 16 });
    pill(ctx, `Last cut · ${fmt(C.tapeIn, 2)} in`, tEnd, 380, { bg: P.ink, color: P.card, size: 14, align: 'right' });
  } else pill(ctx, 'No dark end: tape fills the run', ix1 - 10, 604, { bg: P.good, color: '#fff', size: 15, align: 'right' });
  roundRect(ctx, ix1, 392, 34, 196, 6); ctx.fillStyle = '#5a616c'; ctx.fill();
  txt(ctx, 'End cap', ix1 + 17, 380, { size: 15, weight: 700, align: 'center' });
  txt(ctx, '← run continues', ix0 + 6, 396, { size: 14, color: P.muted });
  if (step < 4) return;
  txt(ctx, 'Decide how to handle the dark end. Measure twice: field dimensions beat drawings, and corners and returns add or subtract length.', 100, 682, { size: 17, color: P.muted, maxW: 1400 });
  [['Accept the gap', `${fmt(C.dark, 2)} in is rarely noticed at normal viewing distance.`],

function drawJumper(ctx, step) {

  txt(ctx, 'corner B', (gapL + rx) / 2, y + th + 34, { size: 15, color: P.muted, align: 'center' });

  const rp = { plus: [rx + padW / 2 + 1.5, y + 2 + padH / 2], minus: [rx + padW / 2 + 1.5, y + th - padH / 2 - 2] };
  const wire = (a, b, color, up, done) => {

  if (step >= 3) { drawCheck(ctx, rp.plus[0], rp.plus[1] - 36, 13, true); txt(ctx, '+ to +, − to −', rp.plus[0] + 22, rp.plus[1] - 32, { size: 15, weight: 700 }); }
  if (step >= 4) {

  wrap(ctx, say, L.l + L.pad + 56, ry + L.pad + 26, 980 - L.pad * 2 - 56, { size: 20 });
  noteCard(ctx, nx, ry, L.r - nx, 'No soldering?', ['Use tape-to-wire connectors: open the lid, slide the tape in so the pads sit under the contacts, close it.', 'Check + and − on the connector match the tape.'], { size: 15, h: rh });
}

    });

function drawAssembly(ctx, step) {

}

/* ---------- 3D helpers (CAD outlines, extruded) ---------- */
const _cadShapes = {};
function cadShape(key) {
  if (_cadShapes[key]) return _cadShapes[key];
  const a = CAD_SH01[key], pts = [];
  for (let i = 0; i < a.length - 2; i += 2) pts.push(new THREE.Vector2(a[i] / 1000, a[i + 1] / 1000));
  return (_cadShapes[key] = new THREE.Shape(pts));
}
/** Extrude a CAD outline along local +Z. s = meters per CAD inch (s > IN exaggerates the cross-section). */
function cadExtrude(key, lenM, s, mat, { miterStart = 0, miterEnd = 0 } = {}) {
  const geo = new THREE.ExtrudeGeometry(cadShape(key), { depth: lenM / s, bevelEnabled: false, curveSegments: 1 });
  geo.scale(s, s, s);
  if (miterStart || miterEnd) {
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const z = pos.getZ(i), x = pos.getX(i);
      if (miterEnd && Math.abs(z - lenM) < 1e-6) pos.setZ(i, lenM + miterEnd * x);
      if (miterStart && Math.abs(z) < 1e-6) pos.setZ(i, -miterStart * x);
    }
    geo.computeVertexNormals();
  }
  return new THREE.Mesh(geo, mat);
}
/** A run whose local +Z points along dir = [dx, dz] (local +X = across, +Y = light direction). */
function jLeg(parent, origin, dir) {
  const g = new THREE.Group(); g.position.copy(v3(origin)); g.rotation.y = Math.atan2(dir[0], dir[1]);
  parent.add(g); g.updateMatrixWorld(true); return g;
}
/** Miter direction so the outside edge of a corner is the long one. */
function miterSign(leg, center) {
  const th = leg.rotation.y, xw = new THREE.Vector3(Math.cos(th), 0, -Math.sin(th));

/** Step through every guide visual with captions; optionally record the whole thing as one video. */
async function playGuide({ record = false } = {}) {
  if (guide.playing) { guide.stop = true; if (window.speechSynthesis) speechSynthesis.cancel(); return; }
  if (state.mode !== 'train') setMode('train');
  const seq = guideSequence(), keepAspect = state.aspect;
  let rec = null, stopped = null, type = null; const chunks = [];
  if (record) {
    const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
    type = window.MediaRecorder && types.find((t) => MediaRecorder.isTypeSupported(t));
    if (!type) { toast('This browser cannot record video'); return; }
    if (state.aspect === 'fill') { state.aspect = '16:9'; layout(); syncUI(); }
    await new Promise((r) => requestAnimationFrame(() => r()));
    const rc = makeCanvas(glCanvas.width - (glCanvas.width % 2), glCanvas.height - (glCanvas.height % 2));
    recording = { rc, ctx: rc.getContext('2d') };
    rec = new MediaRecorder(rc.captureStream(30), { mimeType: type, videoBitsPerSecond: 12e6 });
    rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    stopped = new Promise((r) => (rec.onstop = r));
  }
  Object.assign(guide, { playing: true, stop: false, n: seq.length, record, last: performance.now() });
  state.animPlay = true; setGuideButtons();
  if (rec) { renderFrame(); rec.start(); toast('Recording the guide… press Stop or Esc to end early'); }
  for (let i = 0; i < seq.length && !guide.stop; i++) {
    const { v, step } = seq[i];
    if (state.trainVisual !== v.id) showVisual(v.id, { step }); else { state.trainStep = step; updateBadge(); syncUI(); }
    guide.i = i; guide.caption = guideSay(v, step); guide.t0 = performance.now();
    const words = guide.caption.split(/\s+/).filter(Boolean).length;
    guide.dur = Math.max(4.5, words / 2.6 + 1.6) * 1000 / (state.guidePace || 1);
    requestRender();
    if (state.guideVoice && !record) await Promise.all([guideSpeak(guide.caption), guideWait(2500)]); else await guideWait(guide.dur);
  }
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (rec) {
    await new Promise((r) => setTimeout(r, 400));
    rec.stop(); await stopped; recording = null;
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    downloadBlob(new Blob(chunks, { type }), `${slug(BRAND.name)}_${slug(JOB.name)}-install-guide_${timestamp()}.${ext}`);
    toast(`Saved the guide as ${ext.toUpperCase()}`);

}

/** Keys of job fields edited but not yet applied; syncJobInputs leaves these fields alone. */
const jobDirty = new Set();
function syncJobInputs() {
  const active = document.activeElement;
  document.querySelectorAll('[data-job]').forEach((el) => { if (el === active || jobDirty.has(el.dataset.job)) return; const str = String(JOB[el.dataset.job]); if (el.value !== str) el.value = str; });
}
function refreshApplyButtons() {
  const n = jobDirty.size;
  document.querySelectorAll('.guideApply').forEach((b) => { b.classList.toggle('primary', n > 0); b.innerHTML = `${icon('refresh')}${n ? `Update guide · ${n} change${n > 1 ? 's' : ''}` : 'Update guide'}`; });
}
/** Apply every edited field to JOB. Fields that can't be applied (empty, zero, not a number) stay as typed and are flagged. */
function applyJobEdits() {
  const bad = [];
  document.querySelectorAll('[data-job]').forEach((el) => {
    const k = el.dataset.job; if (!jobDirty.has(k)) return;
    let v = el.value;
    if (typeof JOB[k] === 'number') {
      v = Number(v);
      if (el.value.trim() === '' || !Number.isFinite(v) || v <= 0) { el.setAttribute('aria-invalid', 'true'); bad.push(el.closest('label')?.firstElementChild?.textContent || k); return; }
    }
    JOB[k] = v; el.removeAttribute('aria-invalid'); jobDirty.delete(k);
  });
  afterJobChange(); refreshApplyButtons();
  toast(bad.length ? `Not applied, enter a number above 0: ${bad.join(', ')}` : 'Guide updated');

function readJobFromUrl() {
  const m = location.hash.match(/job=([^&]+)/);
  if (m) try {
    Object.entries(JSON.parse(decodeURIComponent(m[1]))).forEach(([k, v]) => {
      if (!(k in JOB)) return;
      if (Array.isArray(JOB[k]) ? Array.isArray(v) && v.every(Number.isFinite) : typeof v === typeof JOB[k]) JOB[k] = v;
    });
  } catch (e) { console.warn('Ignoring a malformed job link', e); }

function initGuide() {
  Object.assign(state, { guidePace: 1, guideVoice: false, guideOrbit: true });
  const panel = $('#panel');

    jobDirty.add(k); t.removeAttribute('aria-invalid'); refreshApplyButtons();

  panel.addEventListener('keydown', (e) => {

}
