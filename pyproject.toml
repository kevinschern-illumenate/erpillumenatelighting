[project]
name = "illumenate_lighting"
authors = [
    { name = "ilLumenate Lighting", email = "hi@illumenate.lighting"}
]
description = "Custom code for ilLumenate Lighting ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    "pypdf>=3.0.0",  # PDF form-filling and merging for spec submittals
    "Pillow>=13.0.0",  # Validated PNG/JPEG intake and packet raster conversion
    # HEIC/HEIF photo intake (converted to JPEG). 1.8.1 ships cp314 manylinux_2_28 wheels for
    # x86_64 and aarch64, so Frappe Cloud (ubuntu 22.04, glibc 2.35) never builds from source.
    "pillow-heif>=1.8.1,<2",
    "jsonschema>=4.18.0",  # System Designer design_json validation against the exported schema
]

[project.optional-dependencies]
# Local test tools; not installed on benches. Keep in sync with the install step in
# .github/workflows/b2b-contracts.yml (tests/portal_unit/test_dev_dependencies.py checks this).
test = [
    "jsonschema",
    "Jinja2",
    "Pillow",
    "pillow-heif",
    "pypdf",
    "pypdfium2",
    "PyYAML",
    "reportlab",
    "ruff",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Frappe versions this app supports; Frappe Cloud checks this when the app is added to a bench
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
